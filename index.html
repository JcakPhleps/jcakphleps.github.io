<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack Phelps — Projects</title>
<meta name="description" content="An index of things Jack is building.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3f1ea; --panel:#faf9f5; --ink:#17191d; --ink-2:#5c5f66;
    --rule:rgba(23,25,29,.11); --rule-strong:rgba(23,25,29,.2);
    --accent:#1b4dff; --live:#1f9e54; --soon:#b07a1f; --hover:rgba(23,25,29,.035);
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:'Space Grotesk',system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#111317; --panel:#15181d; --ink:#e9e8e3; --ink-2:#9a9da4;
      --rule:rgba(233,232,227,.12); --rule-strong:rgba(233,232,227,.24);
      --accent:#6e8bff; --live:#3fcf7a; --soon:#d6a94a; --hover:rgba(233,232,227,.045);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    font-family:var(--disp);background:var(--paper);color:var(--ink);
    min-height:100vh;line-height:1.5;
    background-image:linear-gradient(var(--rule) 1px,transparent 1px);
    background-size:100% 2px;background-position:0 -1px;background-attachment:fixed;
  }
  .wrap{max-width:860px;margin:0 auto;padding:clamp(40px,8vw,96px) clamp(20px,5vw,36px) 80px}

  /* masthead */
  .mast{display:flex;justify-content:space-between;align-items:flex-end;
    gap:24px;padding-bottom:22px;border-bottom:1.5px solid var(--rule-strong);flex-wrap:wrap}
  .mast h1{font-size:clamp(28px,5vw,40px);font-weight:600;letter-spacing:-.02em;line-height:1.05}
  .mast .sub{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);margin-top:8px;letter-spacing:.01em}
  .mast .meta{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;line-height:1.8}
  .mast .meta b{color:var(--ink);font-weight:500}

  /* column header */
  .cols{display:grid;grid-template-columns:34px 1fr 150px 86px;gap:16px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-2);padding:18px 10px 10px;border-bottom:1px solid var(--rule)}
  .cols span:nth-child(3),.cols span:nth-child(4){text-align:right}

  /* rows */
  .row{display:grid;grid-template-columns:34px 1fr 150px 86px;gap:16px;align-items:center;
    padding:18px 10px;border-bottom:1px solid var(--rule);
    text-decoration:none;color:inherit;position:relative;
    transition:background .15s ease}
  a.row{cursor:pointer}
  a.row:hover{background:var(--hover)}
  a.row:hover .name{color:var(--accent)}
  a.row:hover .go{opacity:1;transform:translateX(0)}
  .row.disabled{cursor:default;opacity:.6}

  .idx{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
  .main .name{font-size:18px;font-weight:600;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:9px;transition:color .15s}
  .main .go{font-family:var(--mono);font-size:13px;color:var(--accent);opacity:0;transform:translateX(-4px);transition:.18s}
  .main .desc{color:var(--ink-2);font-size:14px;margin-top:4px;max-width:46ch}

  .stack{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right;line-height:1.55}

  .status{justify-self:end;font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .status .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .status.live .dot{background:var(--live);box-shadow:0 0 0 3px color-mix(in srgb,var(--live) 22%,transparent)}
  .status.live{color:var(--live)}
  .status.src .dot{background:var(--ink-2)}
  .status.src{color:var(--ink-2)}
  .status.soon .dot{background:var(--soon)}
  .status.soon{color:var(--soon)}

  footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
    margin-top:36px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
  footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule-strong);padding-bottom:1px}
  footer a:hover{color:var(--accent);border-color:var(--accent)}

  @media (max-width:620px){
    .cols{display:none}
    .row{grid-template-columns:28px 1fr auto;gap:12px;align-items:start}
    .stack{display:none}
    .status{grid-column:3;align-self:center}
    .main .desc{max-width:none}
  }

  /* preview modal */
  .overlay{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,11,13,.5);
    backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:clamp(12px,3vw,32px)}
  .overlay.open{display:flex}
  .modal{width:min(1180px,100%);height:min(800px,92vh);background:var(--panel);
    border:1px solid var(--rule-strong);border-radius:10px;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .bar{display:flex;align-items:center;gap:14px;padding:11px 15px;
    border-bottom:1px solid var(--rule);background:var(--paper);font-family:var(--mono);font-size:12.5px}
  .bar .loc{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .loc b{color:var(--ink);font-weight:500}
  .bar .spacer{flex:1}
  .bar a,.bar button{font:inherit;cursor:pointer;background:none;border:0;color:var(--ink-2);
    text-decoration:none;padding:4px 2px;transition:color .15s}
  .bar a:hover{color:var(--accent)}
  .bar .close:hover{color:var(--ink)}
  .bar .close{font-weight:500}
  .modal iframe{flex:1;width:100%;border:0;background:var(--paper)}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <h1>Jack Phelps</h1>
      <div class="sub">An index of things I'm building.</div>
    </div>
    <div class="meta" id="mastMeta"></div>
  </header>

  <div class="cols"><span>#</span><span>Project</span><span>Stack</span><span>Status</span></div>
  <main id="list"></main>

  <footer>
    <span id="footStats"></span>
    <a href="https://github.com/magwann" target="_blank" rel="noopener">github.com/magwann ↗</a>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="bar">
      <span class="loc"><b id="mTitle">preview</b> <span id="mUrl"></span></span>
      <span class="spacer"></span>
      <a id="mOpen" target="_blank" rel="noopener">open ↗</a>
      <a id="mRepo" target="_blank" rel="noopener">source ↗</a>
      <button class="close" onclick="closeModal()">close ✕</button>
    </div>
    <iframe id="mFrame" title="Project preview" allow="fullscreen; autoplay; microphone; camera"></iframe>
  </div>
</div>

<script>
const PROJECTS = [
  { name:"Cribs", desc:"Browser social game — build and visit low-poly, PS2-era digital homes.",
    stack:["Three.js","Firebase"], status:"live",
    url:"https://magwann.github.io/cribs/", repo:"https://github.com/magwann/cribs" },
  { name:"GlassOS", desc:"A Frutiger-Aero desktop environment, reborn. Full glassy OS shell prototype.",
    stack:["Qt6/QML","Web"], status:"live",
    url:"https://magwann.github.io/GlassOS/", repo:"https://github.com/magwann/GlassOS" },
  { name:"dude", desc:"Screen-aware macOS desktop buddy that sees your screen and acts in context.",
    stack:["SwiftUI","Gemini"], status:"src", repo:"https://github.com/magwann/dude" },
  { name:"Sound System", desc:"macOS app for the room speakers with a '90s Pioneer-receiver face.",
    stack:["Swift","CoreAudio"], status:"soon" },
  { name:"SAFE MODE", desc:"Co-op survival horror set inside a PC. Proximity voice, physical malware.",
    stack:["Godot 4.7","GDScript"], status:"soon" },
  { name:"Anti SleepIn", desc:"Roku alarm channel with a dismissal you can't sleep through.",
    stack:["BrightScript"], status:"soon" },
];

const STATUS = {
  live:{cls:"live", label:"live"},
  src :{cls:"src",  label:"source"},
  soon:{cls:"soon", label:"soon"},
};

const list = document.getElementById('list');
PROJECTS.forEach((p,i)=>{
  const s = STATUS[p.status];
  const isLink = p.status==='live' || p.status==='src';
  const el = document.createElement(isLink ? 'a' : 'div');
  el.className = 'row' + (isLink ? '' : ' disabled');
  if (isLink && p.status==='src'){ el.href = p.repo; el.target='_blank'; el.rel='noopener'; }
  el.innerHTML = `
    <span class="idx">${String(i+1).padStart(2,'0')}</span>
    <div class="main">
      <span class="name">${p.name}<span class="go">${p.status==='live'?'preview →':'→'}</span></span>
      <div class="desc">${p.desc}</div>
    </div>
    <div class="stack">${p.stack.join('<br>')}</div>
    <span class="status ${s.cls}"><span class="dot"></span>${s.label}</span>`;
  if (p.status==='live'){ el.href='#'; el.addEventListener('click',e=>{e.preventDefault();openModal(p);}); }
  list.appendChild(el);
});

// masthead + footer stats
const n = PROJECTS.length, live = PROJECTS.filter(p=>p.status==='live').length;
document.getElementById('mastMeta').innerHTML = `<b>${n}</b> projects<br><b>${live}</b> live`;
document.getElementById('footStats').textContent = `${n} projects — ${live} live, ${PROJECTS.filter(p=>p.status==='src').length} source, ${PROJECTS.filter(p=>p.status==='soon').length} in progress`;

// modal
const overlay = document.getElementById('overlay');
function openModal(p){
  document.getElementById('mTitle').textContent = p.name;
  document.getElementById('mUrl').textContent = '— ' + p.url.replace(/^https?:\/\//,'').replace(/\/$/,'');
  document.getElementById('mFrame').src = p.url;
  document.getElementById('mOpen').href = p.url;
  const repo = document.getElementById('mRepo');
  if (p.repo){ repo.href=p.repo; repo.style.display=''; } else repo.style.display='none';
  overlay.classList.add('open'); document.body.style.overflow='hidden';
}
function closeModal(){
  overlay.classList.remove('open');
  document.getElementById('mFrame').src='about:blank';
  document.body.style.overflow='';
}
overlay.addEventListener('click',e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
</script>
</body>
</html>
